
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>MANAS FAB | Business Management</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f8fa;
      color: #202124;
    }
    header {
      background: white;
      padding: 22px 20px;
      border-bottom: 1px solid #e8eaed;
    }
    header h1 {
      margin: 0;
      font-size: 23px;
      letter-spacing: 1px;
    }
    header p {
      margin: 6px 0 0;
      color: #70757a;
      font-size: 13px;
    }
    main {
      max-width: 440px;
      margin: 45px auto;
      padding: 20px;
    }
    .panel {
      background: white;
      border: 1px solid #e8eaed;
      border-radius: 14px;
      padding: 25px 20px;
      box-shadow: 0 3px 14px rgba(0,0,0,.04);
    }
    h2 { margin-top: 0; font-size: 21px; }
    label {
      display: block;
      font-size: 14px;
      margin: 18px 0 7px;
    }
    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #dadce0;
      border-radius: 8px;
      font-size: 16px;
    }
    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      background: #1a73e8;
      color: white;
      border: 0;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: .6; }
    #message {
      margin-top: 15px;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }
    .muted { color: #70757a; font-size: 13px; }
    #dashboard { display: none; }
  </style>
</head>
<body>
  <header>
    <h1>MANAS FAB</h1>
    <p>Business Management System</p>
  </header>

  <main>
    <section class="panel" id="login">
      <h2>Welcome back</h2>
      <p class="muted">Sign in to your MANAS FAB account.</p>

      <form id="loginForm">
        <label for="email">Email address</label>
        <input id="email" type="email" required
          placeholder="Enter your email">

        <label for="password">Password</label>
        <input id="password" type="password" required
          placeholder="Enter your password">

        <button id="loginButton" type="submit">Sign in</button>
      </form>
      <div id="message" role="status"></div>
    </section>

    <section class="panel" id="dashboard">
      <h2>MANAS FAB Dashboard</h2>
      <p id="welcome"></p>
      <p class="muted">Your account is signed in.</p>
      <button id="logoutButton" type="button">Sign out</button>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCsl7Pm1j7YAnZ_n2bq7o77g8nEzbEpUMM",
      authDomain: "manas-fab.firebaseapp.com",
      projectId: "manas-fab",
      storageBucket: "manas-fab.firebasestorage.app",
      messagingSenderId: "128787967017",
      appId: "1:128787967017:web:5d53abe54d40bf9fad8038",
      measurementId: "G-CCW6G57DZ8"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const login = document.getElementById("login");
    const dashboard = document.getElementById("dashboard");
    const message = document.getElementById("message");
    const loginButton = document.getElementById("loginButton");

    document.getElementById("loginForm").addEventListener("submit",
      async (event) => {
        event.preventDefault();
        message.textContent = "Signing in...";
        loginButton.disabled = true;

        try {
          await signInWithEmailAndPassword(
            auth,
            document.getElementById("email").value.trim(),
            document.getElementById("password").value
          );
          message.textContent = "";
        } catch (error) {
          message.textContent = "Sign-in failed. Check your email and password.";
        } finally {
          loginButton.disabled = false;
        }
      }
    );

    document.getElementById("logoutButton").addEventListener("click",
      () => signOut(auth)
    );

    onAuthStateChanged(auth, (user) => {
      if (user) {
        login.style.display = "none";
        dashboard.style.display = "block";
        document.getElementById("welcome").textContent =
          "Signed in as " + user.email;
      } else {
        dashboard.style.display = "none";
        login.style.display = "block";
      }
    });
  </script>
</body>
</html>
